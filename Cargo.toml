[package]
name = "trck"
description = "Deterministic in-repo issue tracker"
version = "0.29.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/leonkacowicz/trck"
rust-version = "1.85"

# No dependencies, and that is a design constraint rather than an accident of being early:
# the binary is meant to be a single self-contained artifact that a repo can depend on for
# years, and every dependency is a future reason it stops building.
[dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

# The engine's whole job is reading and writing files and exiting with a status.
# unwrap/expect are the things that turn a bad tracker into a panic instead of a
# diagnostic, so they are errors rather than style notes.
[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
