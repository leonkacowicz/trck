[package]
name = "trck"
description = "Deterministic in-repo issue tracker"
version = "0.30.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/leonkacowicz/trck"
rust-version = "1.85"

# Empty today, but not a rule. The constraint is that the binary stays a single self-contained
# artifact a repo can depend on for years: a crate is fine if it links statically in, and what
# is ruled out is anything the user's machine must supply at run time — a shared library, a
# runtime, a package tree. `git` is the one exception, and definitional: the engine drives git
# plumbing directly. Weigh each crate on build cost and supply-chain surface; std is the default.
[dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

# The engine's whole job is reading and writing files and exiting with a status.
# unwrap/expect are the things that turn a bad tracker into a panic instead of a
# diagnostic, so they are errors rather than style notes.
[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
