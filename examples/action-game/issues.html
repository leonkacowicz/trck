<title>trck · examples</title>
<style>
:root {
  --bg: #ffffff; --fg: #1b1f24; --muted: #6a737d; --line: #e1e4e8;
  --panel: #f6f8fa; --accent: #0969da; --sel: #ddf4ff; --done: #8b949e; --hot: #cf222e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --line: #30363d;
    --panel: #161b22; --accent: #4493f8; --sel: #163356; --done: #6e7681; --hot: #ff7b72;
  }
}
* { box-sizing: border-box; }
/* `setView` swaps panes with the `hidden` attribute, and a pane that declares its own
   `display` (`.board`, `.filters`, …) would otherwise win: author rules outrank the UA's
   `[hidden] { display: none }` at any specificity. Keep this ahead of every layout rule. */
[hidden] { display: none !important; }
body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
       color: var(--fg); background: var(--bg); }
.topbar { display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap;
          padding: .7rem 1rem; border-bottom: 1px solid var(--line); }
.topbar h1 { font-size: 1.05rem; margin: 0; }
.counts { color: var(--muted); display: flex; gap: .9rem; flex-wrap: wrap; }
.counts .count b { color: var(--fg); }
.filters { display: flex; gap: .5rem; padding: .6rem 1rem; border-bottom: 1px solid var(--line);
           flex-wrap: wrap; position: sticky; top: 0; background: var(--bg); z-index: 1; }
.filters input, .filters select { font: inherit; padding: .35rem .5rem;
           border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
.filters input { flex: 1 1 16rem; }
/* Facet groups: a caption plus one checkbox per configured value. They wrap with
   the rest of the bar, and setView hides the ones the active view doesn't apply. */
.facets { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
          padding: .2rem .5rem; border: 1px solid var(--line); border-radius: 6px; }
.facets .fcap { color: var(--muted); font-size: .78rem; text-transform: uppercase;
                letter-spacing: .04em; }
.fbox { display: inline-flex; align-items: center; gap: .25rem; cursor: pointer;
        white-space: nowrap; }
.fbox input { flex: none; margin: 0; }
main { display: grid; grid-template-columns: minmax(12rem, var(--leftw, 40%)) 6px minmax(16rem, 1fr);
       gap: 0; height: calc(100vh - 92px); }
@media (max-width: 720px) { main { grid-template-columns: 1fr; height: auto; } .divider { display: none; } }
.divider { background: var(--line); cursor: col-resize; }
.divider:hover, .divider.drag { background: var(--accent); }
.leftpane { overflow: hidden; }
.list { list-style: none; margin: 0; padding: 0; height: 100%; overflow: auto; }
.row { display: flex; align-items: center; gap: .5rem; padding: .45rem .8rem;
       border-bottom: 1px solid var(--line); cursor: pointer; }
.row:hover { background: var(--panel); }
.row.sel { background: var(--sel); }
.row.done .rtitle { color: var(--done); text-decoration: line-through; }
.rid { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .82rem; }
.idpre { color: var(--fg); font-weight: 600; }
.idrest { color: var(--muted); }
.rtitle { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pct { color: var(--muted); font-size: .8rem; }
.badge { font-size: .72rem; padding: .05rem .4rem; border-radius: 999px;
         border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
/* Actionable, not just another attribute — the ready badge reads as a call to act,
   so it takes the accent the neutral status/priority badges deliberately don't. */
.badge.ready { border-color: var(--accent); color: var(--accent); }
/* ready view: the `next` pick and the ↑<priority>(#id) demand marker. Tinting is
   positional (top / bottom of the configured order), mirroring `priority_codes`. */
.rmark { display: flex; align-items: center; gap: .4rem; white-space: nowrap; }
.nextpill { font-size: .68rem; letter-spacing: .04em; text-transform: uppercase;
            padding: .05rem .4rem; border-radius: 999px; color: var(--bg);
            background: var(--accent); }
.up { font-size: .74rem; color: var(--muted); }
.up.top { color: var(--hot); }
.up.bottom { opacity: .7; }
.up .idpre, .up .idrest { color: inherit; font-size: inherit; }
.detail { overflow: auto; padding: 1rem 1.3rem; }
.detail h2 { margin: .2rem 0 1rem; font-size: 1.15rem; }
.detail .rid { font-size: .9rem; }
.meta { display: grid; grid-template-columns: max-content 1fr; gap: .3rem .8rem; margin-bottom: 1rem; }
.meta .m { display: contents; }
.meta .mk { color: var(--muted); text-align: right; }
.body { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
        padding: .8rem 1rem; white-space: pre-wrap; word-wrap: break-word;
        font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }
.bodybar { display: flex; justify-content: flex-end; margin-bottom: .3rem; }
.bodytog { font: inherit; font-size: .78rem; padding: .12rem .55rem; border: 1px solid var(--line);
           border-radius: 6px; background: var(--bg); color: var(--muted); cursor: pointer; }
.bodytog:hover { border-color: var(--accent); color: var(--accent); }
.body.md { white-space: normal; font: inherit; }
.body.md > :first-child { margin-top: 0; }
.body.md h1, .body.md h2, .body.md h3, .body.md h4 { margin: .9rem 0 .4rem; line-height: 1.25; }
.body.md h1 { font-size: 1.3rem; } .body.md h2 { font-size: 1.14rem; }
.body.md h3 { font-size: 1.02rem; } .body.md h4 { font-size: .95rem; }
.body.md p { margin: .5rem 0; }
.body.md ul, .body.md ol { margin: .4rem 0; padding-left: 1.4rem; }
.body.md li { margin: .18rem 0; }
.body.md li.md-task { list-style: none; margin-left: -1.2rem; }
.body.md li.md-task input { margin-right: .45rem; vertical-align: middle; }
.body.md code { background: var(--bg); border: 1px solid var(--line); border-radius: 4px;
                padding: .03rem .3rem; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
.body.md pre.md-code { background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
                       padding: .7rem .9rem; overflow: auto; white-space: pre; }
.body.md pre.md-code code { background: none; border: 0; padding: 0; }
.body.md a { color: var(--accent); }
.body.md hr { border: 0; border-top: 1px solid var(--line); margin: .9rem 0; }
.ilink { color: var(--accent); text-decoration: none; }
.ilink:hover { text-decoration: underline; }
.empty { color: var(--muted); padding: 1rem; }
.emark { color: var(--accent); font-size: .7rem; }
.prlink { color: var(--accent); text-decoration: none; font-size: .72rem;
          padding: .05rem .4rem; border: 1px solid var(--line); border-radius: 999px;
          white-space: nowrap; }
.prlink:hover { text-decoration: underline; }
.m .prlink { font-size: .8rem; border: 0; padding: 0; }
.row.edited { box-shadow: inset 3px 0 0 var(--accent); }
.stage { display: flex; gap: .9rem; align-items: center; flex-wrap: wrap;
         margin: 0 0 1rem; padding: .5rem .7rem; border: 1px dashed var(--line); border-radius: 8px; }
.stage .stagek { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; }
.sfield { display: inline-flex; align-items: center; gap: .35rem; color: var(--muted); font-size: .85rem; }
.sedit { font: inherit; padding: .2rem .4rem; border: 1px solid var(--line); border-radius: 6px;
         background: var(--bg); color: var(--fg); }
.pending { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel);
           border-top: 1px solid var(--line); box-shadow: 0 -4px 14px rgba(0,0,0,.14);
           max-height: 42vh; display: flex; flex-direction: column; z-index: 5; }
.pbar { display: flex; align-items: center; gap: .7rem; padding: .5rem .9rem;
        border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.pcount { font-weight: 600; }
.phint { color: var(--muted); font-size: .8rem; }
.pspace { flex: 1; }
.pending button { font: inherit; padding: .3rem .8rem; border: 1px solid var(--line);
                  border-radius: 6px; background: var(--bg); color: var(--fg); cursor: pointer; }
.pending button:hover { border-color: var(--accent); color: var(--accent); }
.plist { list-style: none; margin: 0; padding: .5rem .9rem; overflow: auto; }
.pcmd { font: 13px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; user-select: all; white-space: pre-wrap; }
.viewtoggle { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.viewtoggle button { font: inherit; padding: .35rem .8rem; border: 0; background: var(--bg);
                     color: var(--muted); cursor: pointer; }
.viewtoggle button.on { background: var(--accent); color: #fff; }
.graph { height: 100%; overflow: auto; padding: 1rem; }
.graph svg { display: block; }
.gbar { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: .7rem;
        font-size: .82rem; color: var(--muted); }
.gcheck { display: inline-flex; align-items: center; gap: .25rem; cursor: pointer; }
.ghint { font-style: italic; }
.gnode { cursor: pointer; }
.gnode rect { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; }
.gnode:hover rect { stroke: var(--accent); }
.gnode.sel rect { stroke: var(--accent); stroke-width: 2.5; fill: var(--sel); }
.gnode.done { opacity: .5; }
.gnode text { fill: var(--fg); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
.gnode .gidpre { font-weight: 600; }
.gnode .gidrest { fill: var(--muted); }
.gedge { stroke: var(--muted); stroke-width: 1.5; fill: none; }
/* Hovering a node lifts the edges it touches. Both directions take the same accent the
   hovered box itself takes — the arrowhead already says which way an edge runs, and two
   colours here would collide with the accent `.gnode.sel` is using a few lines up. The
   head has to be swapped rather than recoloured: a shared <marker> paints with its own
   fill and cannot inherit the stroke of the path referencing it. */
.gedge.hi { stroke: var(--accent); marker-end: url(#arrow-hi); }
.gempty { color: var(--muted); padding: 1rem; }
.tree { height: 100%; overflow: auto; padding: .3rem 0; }
.trow { display: flex; align-items: center; gap: .4rem; padding: .3rem .6rem; cursor: pointer; }
.trow:hover { background: var(--panel); }
.trow.sel { background: var(--sel); }
.trow.done .ttitle { color: var(--done); text-decoration: line-through; }
.tcaret { width: 1.1em; flex: none; color: var(--muted); text-align: center; user-select: none; }
.tcaret.leaf { visibility: hidden; }
.ttitle { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tbar { flex: none; width: 46px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.tbar > i { display: block; height: 100%; background: var(--accent); }
.tpct { flex: none; color: var(--muted); font-size: .78rem; width: 2.6em; text-align: right; }
.board { height: 100%; display: flex; gap: .6rem; padding: .6rem; overflow-x: auto; align-items: flex-start; }
.bcol { flex: 1 0 11rem; min-width: 10rem; max-height: 100%; display: flex; flex-direction: column;
        background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.bhead { padding: .45rem .6rem; border-bottom: 1px solid var(--line); font-weight: 600;
         display: flex; justify-content: space-between; gap: .5rem; }
.bhead .bn { color: var(--muted); font-weight: 400; }
.bcards { padding: .4rem; overflow: auto; display: flex; flex-direction: column; gap: .4rem; }
.card { background: var(--bg); border: 1px solid var(--line); border-radius: 7px;
        padding: .45rem .55rem; cursor: pointer; }
.card:hover { border-color: var(--accent); }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--sel); }
.card.done { opacity: .6; }
.card.done .ct { text-decoration: line-through; }
.card.edited { box-shadow: inset 3px 0 0 var(--accent); }
.card .cid { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .76rem; }
.card .ct { display: block; margin: .15rem 0; }
.card .cmeta { display: flex; gap: .35rem; align-items: center; flex-wrap: wrap; }
.bempty { color: var(--muted); font-size: .82rem; padding: .3rem; }

</style>

<header class="topbar">
  <h1 id="repo"></h1>
  <div id="counts" class="counts"></div>
</header>
<div class="filters">
  <div class="viewtoggle">

</div>
<main>
  <div class="leftpane">

</main>

    <span class="phint">staged edits don't persist — run these in your terminal</span>
    <span class="pspace"></span>
    <button id="pcopy" type="button">Copy all</button>
    <button id="pclear" type="button">Clear</button>
  </div>
  <ul id="plist" class="plist"></ul>
</div>

vel without a visible hero). Depends on\n#016.\n", "plen": 2}, {"id": "fd34m5t", "title": "Enemy sprite sheets", "status": "backlog", "priority": "medium", "kind": "task", "points": 5, "labels": ["art", "enemies"], "resolution": null, "parent": "9angn6c", "children": [], "requires": ["adejzqs"], "dependents": [], "blocked": false, "ready": true, "demand": [0, 0, 2, 0, 0, 0], "demand_source": null, "leaf": true, "terminal": false, "progress": null, "created": "2026-06-10", "started": null, "closed": null, "spec": null, "pr": null, "body": "# Enemy sprite sheets\n\n## Summary\nEnemy sprite sheets for the first roster (patroller, charger): idle, move, attack, and\nhit/death frames each.\n\n## Acceptance criteria\n- [ ] Each enemy has idle/move/attack/death animations\n- [ ] Death frames hand off to the despawn logic\n- [ ] Imported through #016\n\n## Notes\nDepends on the atlas tool #016. Pairs with enemy AI #013 on the gameplay side.\n", "plen": 2}, {"id": "gbnvvsc", "title": "Enemy AI: patrol \u0026 aggro", "status": "backlog", "priority": "medium", "kind": "story", "points": 5, "labels": ["combat", "enemies"], "resolution": null, "parent": "6ekkhbe", "children": [], "requires": ["2sg3uhd"], "dependents": ["r3m4yz9"], "blocked": true, "ready": false, "demand": [0, 3, 8, 1, 0, 0], "demand_source": "6ekkhbe", "leaf": true, "terminal": false, "progress": null, "created": "2026-06-10", "started": null, "closed": null, "spec": null, "pr": null, "body": "# Enemy AI: patrol \u0026 aggro\n\n## Summary\nBasic enemy AI: patrol a path, detect the player within a vision cone, switch to\naggro/chase, and return to patrol when the player escapes.\n\n## Acceptance criteria\n- [ ] Enemies patrol between waypoints\n- [ ] Vision cone triggers aggro; line-of-sight is required\n- [ ] Enemies disengage and reset after losing the player\n\n## Notes\nDepends on melee #010 (needs something to react to). Blocks the death-hitbox bug #015.\n", "plen": 1}, {"id": "h9chxqu", "title": "Pick a sav  ] Ammo/energy is consumed and regenerates\n\n## Notes\nDepends on melee #010 so both share the same attack-state machine. Labelled needs-design —\ncharge curve and ammo economy are unresolved.\n", "plen": 1}, {"id": "nmde6ad", "title": "Save / load system", "status": "backlog", "priority": "medium", "kind": "task", "points": 5, "labels": ["tech"], "resolution": null, "parent": null, "children": [], "requires": ["h9chxqu", "xzyw9wm"], "dependents": [], "blocked": true, "ready": false, "demand": [0, 0, 1, 0, 0, 0], "demand_source": null, "leaf": true, "terminal": false, "progress": null, "created": "2026-06-10", "started": null, "closed": null, "spec": null, "pr": null, "body": "# Save / load system\n\n## Summary\nSave / load system: serialise progress (current level, checkpoint, unlocks, settings) and\nrestore it on launch.\n\n## Acceptance criteria\n- [ ] Saves and restores level, checkpoint, and unlocks\n- [ ] Handles a missing/corrupt save gracefully\n- [ ] Uses the format chosen in #031\n\n## Notes\nDepends on the format decision #031 and on checkpoints #024 (the main thing worth saving).\n", "plen": 2}, {"id": "nnxgpen", "title": "Prototype WASD movement", "status": "done", "priority": "medium", "kind": "task", "points": 2, "labels": ["movement", "tech-debt"], "resolution": "superseded", "parent": null, "children": [], "requires": [], "dependents": [], "blocked": false, "ready": false, "demand": [0, 0, 1, 0, 0, 0], "demand_source": null, "leaf": true, "terminal": true, "progress": null, "created": "2026-06-10", "started": "2026-06-10", "closed": "2026-06-10", "spec": null, "pr": null, "body": "# Prototype WASD movement\n\n## Summary\nThrowaway prototype of WASD movement used to validate the feel before building the real\ncontroller.\n\n## Acceptance criteria\n- [ ] Prototype moved a capsule around a test scene\n\n## Notes\nClosed as **superseded** by the production controller #007. Kept in the tracker as a record\nof the spike.\n", "plen": 2}, {"id": "nv76h2p", }, {"id": "r3m4yz9", "title": "Hitbox persists after enemy death", "status": "backlog", "priority": "high", "kind": "bug", "points": 1, "labels": ["combat", "enemies", "tech-debt"], "resolution": null, "parent": "6ekkhbe", "children": [], "requires": ["gbnvvsc"], "dependents": [], "blocked": true, "ready": false, "demand": [0, 3, 7, 1, 0, 0], "demand_source": null, "leaf": true, "terminal": false, "progress": null, "created": "2026-06-10", "started": null, "closed": null, "spec": null, "pr": null, "body": "# Hitbox persists after enemy death\n\n## Summary\nBug: an enemy's hitbox lingers for a few frames after death, so a corpse can still deal\ncontact damage.\n\n## Acceptance criteria\n- [ ] Hitbox is disabled on the death event from #012\n- [ ] No contact damage after an enemy's death animation starts\n- [ ] Covered by a test\n\n## Notes\nTagged tech-debt — the death path in the AI #013 never disabled the collider. Depends on\nenemy AI #013.\n", "plen": 2}, {"id": "r4c8ajk", "title": "Forest tileset", "status": "backlog", "priority": "medium", "kind": "task", "points": 3, "labels": ["art"], "resolution": null, "parent": "9angn6c", "children": [], "requires": ["adejzqs"], "dependents": ["exg4e3b"], "blocked": false, "ready": true, "demand": [0, 0, 6, 0, 0, 0], "demand_source": null, "leaf": true, "terminal": false, "progress": null, "created": "2026-06-10", "started": null, "closed": null, "spec": null, "pr": null, "body": "# Forest tileset\n\n## Summary\nForest biome tileset: ground, platforms, edges, background flora, and a few decorative\nprops, authored to tile seamlessly.\n\n## Acceptance criteria\n- [ ] Auto-tiling works for ground and platform edges\n- [ ] At least two parallax background layers\n- [ ] Imported through #016\n\n## Notes\nDepends on #016. Consumed by Level 1 #021.\n", "plen": 2}, {"id": "sr4c37v", "title": "Cave tileset", "status": "backlog", "priority": "medium", "kind": "task", "points": 3, "labels": ["art"], "resolution": null, "parent": "9angn6c", "children": [], "requires": ["adejzqs"], "dependents": ["dm9t6h7"], "blocked": false, "ready": true, "demand": [0, 0, 4, 0, 0, 0], "demand_source": null, "leaf": true, "terminal": false, "progress": null, "created": "2026-06-10", "started": null, "closed": null, "spec": null, "pr": null, "body": "# Cave tileset\n\n## Summary\nCave biome tileset: darker palette, stalactite/stalagmite props, and hazard tiles (spikes).\n\n## Acceptance criteria\n- [ ] Auto-tiling for cave walls and floors\n- [ ] Spike hazard tiles wired to the damage system #012\n- [ ] Imported through #016\n\n## Notes\nDepends on #016. Consumed by Level 2 #022.\n", "plen": 1}, {"id": "vg35ftf", "title": "Forest biome music", "status": "backlog", "priority": "medium", "kind": "task", "points": 3, "labels": ["audio"], "resolution": null, "parent": "8ge7ef4", "children": [], "requires": [], "dependents": [], "blocked": false, "ready": true, "demand": [0, 0, 1, 1, 0, 0], "demand_source": null, "leaf": true, "terminal": false, "progress": null, "created": "2026-06-10", "started": null, "closed": null, "spec": null, "pr": null, "body": "# Forest biome music\n\n## Summary\nLooping ambient music track for the forest biome that fades in/out at biome boundaries.\n\n## Acceptance criteria\n- [ ] Track loops seamlessly\n- [ ] Crossfades when entering/leaving the forest\n- [ ] Streamed, not fully decoded into memory\n\n## Notes\nNo hard dependencies — can be produced in parallel.\n", "plen": 1}, {"id": "xzyw9wm", "title": "Checkpoint \u0026 respawn", "status": "backlog", "priority": "medium", "kind": "task", "points": 3, "labels": ["level-design", "tech"], "resolution": null, "parent": "qw3rnfb", "children": [], "requires": [], "dependents": ["nmde6ad"], "blocked": true, "ready": false, "demand": [0, 0, 3, 0, 0, 0], "demand_source": null, "leaf": true, "terminal": false, "progress": null, "created": "2026-06-10", "started": null, "closed": null, "spec": null, "pr": null, "body": "# Checkpoint \u0026 respawn\n\n## Summary\nCheckpoint flags and respawn-on-death: returning the player to the last checkpoint with\nhealth restored.\n\n## Acceptance criteria\n- [ ] Touching a checkpoint records a respawn point\n- [ ] Death respawns at the last checkpoint via #012's death event\n- [ ] Checkpoints persist within a play session\n\n## Notes\nDepends on the health/death system #012. Feeds the save system #032.\n", "plen": 1}, {"id": "ypu9mn9", "title": "Online co-op multiplayer", "status": "done", "priority": "medium", "kind": "story", "points": 13, "labels": ["multiplayer", "needs-design"], "resolution": "wontfix", "parent": null, "children": [], "requires": [], "dependents": [], "blocked": false, "ready": false, "demand": [0, 0, 1, 0, 0, 0], "demand_source": null, "leaf": true, "terminal": true, "progress": null, "created": "2026-06-10", "started": "2026-06-10", "closed": "2026-06-10", "spec": null, "pr": null, "body": "# Online co-op multiplayer\n\n## Summary\nStory: online co-op multiplayer — a second player joins a session over the network and plays\nthrough levels together.\n\n## Acceptance criteria\n- [ ] Two players in one session\n- [ ] Networked movement and combat stay in sync\n\n## Notes\nClosed as **wontfix** for v1 — networking is out of scope for the initial single-player\nrelease. Revisit post-launch.\n", "plen": 1}, {"id": "z8be3ac", "title": "HUD: health \u0026 ammo", "status": "backlog", "priority": "medium", "kind": "task", "points": 3, "labels": ["ux"], "resolution": null, "parent": "hqpjvhv", "children": [], "requires": ["7qax2vu"], "dependents": [], "blocked": true, "ready": false, "demand": [0, 0, 2, 0, 0, 0], "demand_source": null, "leaf": true, "terminal": false, "progress": null, "created": "2026-06-10", "started": null, "closed": null, "spec": null, "pr": null, "body": "# HUD: health \u0026 ammo\n\n## Summary\nIn-game HUD showing current health and ammo/energy, updating live as the values change.\n\n## Acceptance criteria\n- [ ] Health bar reflects #012 in real time\n- [ ] Ammo/energy meter reflects ranged #011 usage\n- [ ] HUD hides during cutscenes\n\n## Notes\nDepends on the health system #012.\n", "plen": 1}], "edges": [{"from": "br4e7qz", "to": "2v3w3zj"}, {"from": "5qmdpg6", "to": "3msf24b"}, {"from": "exg4e3b", "to": "5a6ka92"}, {"from": "5qmdpg6", "to": "6ekkhbe"}, {"from": "e6mpzcj", "to": "adgus46"}, {"from": "exg4e3b", "to": "dm9t6h7"}, {"from": "sr4c37v", "to": "dm9t6h7"}, {"from": "5qmdpg6", "to": "e6mpzcj"}, {"from": "e6mpzcj", "to": "exg4e3b"}, {"from": "fb8zz9c", "to": "exg4e3b"}, {"from": "r4c8ajk", "to": "exg4e3b"}, {"from": "adejzqs", "to": "fb8zz9c"}, {"from": "adejzqs", "to": "fd34m5t"}, {"from": "2sg3uhd", "to": "gbnvvsc"}, {"from": "2sg3uhd", "to": "m9n7pn6"}, {"from": "h9chxqu", "to": "nmde6ad"}, {"from": "xzyw9wm", "to": "nmde6ad"}, {"from": "6ekkhbe", "to": "nv76h2p"}, {"from": "6ekkhbe", "to": "qw3rnfb"}, {"from": "gbnvvsc", "to": "r3m4yz9"}, {"from": "adejzqs", "to": "r4c8ajk"}, {"from": "adejzqs", "to": "sr4c37v"}, {"from": "7qax2vu", "to": "z8be3ac"}], "roots": ["2xen4un", "8ge7ef4", "9angn6c", "h9chxqu", "hqpjvhv", "j7n7grh", "nmde6ad", "nnxgpen", "qw3rnfb", "ypu9mn9"]}</script>
<script>

const DATA = JSON.parse(document.getElementById('trck-data').textContent);
const $ = (s, r = document) => r.querySelector(s);
function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const kid of kids) if (kid != null) n.append(kid);
  return n;
}

const byId = Object.fromEntries(DATA.issues.map(i => [i.id, i]));
const terminal = new Set(DATA.config.statuses.filter(s => s.role === 'terminal').map(s => s.name));
const prio = DATA.config.priorities;
// What each facet offers a box for. Also the seed for its selection: everything starts
// checked, so the bar states what is on screen instead of sitting empty beside an
// unfiltered list, and unchecking is the whole gesture.
const FACET_VALUES = {
  status: new Set(DATA.config.statuses.map(s => s.name)),
  priority: new Set(DATA.config.priorities),
};
const state = { q: '', status: new Set(FACET_VALUES.status),
  priority: new Set(FACET_VALUES.priority), selected: null, edits: {},
  // Every parent starts collapsed, so the tree opens on its roots and expanding is the
  // gesture. A hierarchy view whose default is every leaf at once is just the list.
  view: 'list', collapsed: new Set(DATA.issues.filter(i => (i.children || []).length)
                                              .map(i => i.id)), bodyRaw: false,
  graphIncludeDone: false, graphOmitDone: false };

// --- filter facets (pure; exercised directly by the test suite) --------------
// Status and priority are multi-select, and every box starts checked, so a selection
// says exactly what is showing and narrowing means unchecking. It has to mean that all
// the way down: emptying the selection shows nothing rather than wrapping back around
// to showing everything, which is the reading that makes the boxes trustworthy.
//
// A value the facet offers no box for is exempt — an issue can carry a status the
// config no longer lists, and nothing that cannot be checked may hide it.
//
// Not every view has a use for them. A board already lays issues out *by* status,
// so filtering by it would blank columns rather than narrow anything; ready is a
// single ranked answer to "what now?", and slicing it by either facet just hides
// the answer. A view therefore declares which facets it applies, and the rest are
// not consulted — the selection is kept, not cleared, so a trip through board or
// ready leaves the list's filter exactly as it was.
const VIEW_FACETS = {
  list: ['status', 'priority'],
  graph: ['status', 'priority'],
  tree: ['status', 'priority'],
  board: ['priority'],
  ready: [],
};
const facetsFor = v => VIEW_FACETS[v] || [];
const passesFacet = (view, facet, sel, value, vocab) =>
  !facetsFor(view).includes(facet) || !vocab.has(value) || sel.has(value);
// --- end filter facets -------------------------------------------------------

// --- staged edits (v2 command-copy): key `${id}::${field}` -> new value ------
const editKey = (id, field) => id + '::' + field;
const stagedValue = (i, field) => {
  const k = editKey(i.id, field);
  return k in state.edits ? state.edits[k] : i[field];
};
const issueEdited = id => Object.keys(state.edits).some(k => k.slice(0, k.indexOf('::')) === id);
function setEdit(i, field, value) {
  const k = editKey(i.id, field);
  if (value === i[field]) delete state.edits[k];
  else state.edits[k] = value;
  renderDetail(); renderPending(); renderActiveView();
}
function commandFor(id, field, value) {
  const c = DATA.config.cmd;
  if (field === 'status') return c + ' mv ' + id + ' ' + value;
  if (field === 'priority') return c + ' set ' + id + ' --priority ' + value;
  return '';
}
function pendingCommands() {
  return Object.entries(state.edits).map(([k, v]) => {
    const id = k.slice(0, k.indexOf('::')), field = k.slice(k.indexOf('::') + 2);
    return commandFor(id, field, v);
  });
}
function renderPending() {
  const box = $('#pending'), list = $('#plist'); list.textContent = '';
  const cmds = pendingCommands();
  if (!cmds.length) { box.hidden = true; return; }
  box.hidden = false;
  $('#pcount').textContent = cmds.length + (cmds.length === 1 ? ' command' : ' commands');
  for (const c of cmds) list.append(el('li', { class: 'pcmd', text: c }));
}
function flash(sel, msg) {
  const b = $(sel), t = b.textContent;
  b.textContent = msg; setTimeout(() => { b.textContent = t; }, 1200);
}
async function copyAll() {
  const text = pendingCommands().join('\n');
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = el('textarea'); ta.value = text; document.body.append(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
  }
  flash('#pcopy', 'Copied!');
}
function clearEdits() { state.edits = {}; renderDetail(); renderPending(); renderActiveView(); }
function editSelect(i, field, values) {
  const cur = stagedValue(i, field);
  const sel = el('select', { class: 'sedit', onchange: e => setEdit(i, field, e.target.value) });
  for (const v of values) {
    const opt = el('option', { value: v, text: v });
    if (v === cur) opt.selected = true;
    sel.append(opt);
  }
  return sel;
}

function matches(i) {
  if (!passesFacet(state.view, 'status', state.status, i.status, FACET_VALUES.status)) return false;
  if (!passesFacet(state.view, 'priority', state.priority, i.priority, FACET_VALUES.priority)) return false;
  if (state.q) {
    const hay = (i.id + ' ' + i.title + ' ' + (i.body || '') + ' ' + i.labels.join(' ')).toLowerCase();
    if (!hay.includes(state.q.toLowerCase())) return false;
  }
  return true;
}

function renderCounts() {
  const counts = {};
  for (const s of DATA.config.statuses) counts[s.name] = 0;
  for (const i of DATA.issues) counts[i.status] = (counts[i.status] || 0) + 1;
  const c = $('#counts'); c.textContent = '';
  for (const s of DATA.config.statuses)
    c.append(el('span', { class: 'count' }, el('b', { text: String(counts[s.name] || 0) }), ' ' + s.name));
  c.append(el('span', { class: 'count total' }, el('b', { text: String(DATA.issues.length) }), ' total'));
}

// Render `#<id>` with its shortest-unique prefix emphasised and the remainder dimmed —
// git-short-hash style, mirroring `hl_id` in the CLI. `plen` comes from the model.
function ridSpan(id, cls) {
  const n = (byId[id] && byId[id].plen) || id.length;
  return el('span', { class: cls },
    '#',
    el('b', { class: 'idpre', text: id.slice(0, n) }),
    n < id.length ? el('span', { class: 'idrest', text: id.slice(n) }) : null);
}

function link(id) {
  const i = byId[id];
  return el('a', { class: 'ilink', href: '#', text: '#' + id + (i ? ' ' + i.title : ''),
    onclick: e => { e.preventDefault(); select(id); } });
}
function links(ids) {
  const w = el('span');
  ids.forEach((id, n) => { if (n) w.append(', '); w.append(link(id)); });
  return w;
}

// `extra` is an optional trailing node (the ready view's ↑-marker and next pill);
// it rides after the badges so both views share one row shape.
function row(i, extra) {
  const cls = 'row' + (terminal.has(i.status) ? ' done' : '')
    + (i.id === state.selected ? ' sel' : '') + (issueEdited(i.id) ? ' edited' : '');
  const r = el('li', { class: cls, onclick: () => select(i.id) },
    ridSpan(i.id, 'rid'),
    el('span', { class: 'rtitle', text: i.title }),
    el('span', { class: 'badge', text: i.priority }),
    el('span', { class: 'badge', text: i.status }));
  if (issueEdited(i.id)) r.append(el('span', { class: 'emark', title: 'has staged changes', text: '●' }));
  const pl = prLink(i, 'PR');
  if (pl) r.append(pl);
  if (i.progress) r.append(el('span', { class: 'pct', text: i.progress.pct + '%' }));
  if (extra) r.append(extra);
  return r;
}

function renderList() {
  const list = $('#list'); list.textContent = '';
  const rows = DATA.issues.filter(matches).sort((a, b) =>
    (prio.indexOf(a.priority) - prio.indexOf(b.priority)) || a.id.localeCompare(b.id));
  if (!rows.length) { list.append(el('li', { class: 'empty', text: 'No matching issues.' })); return; }
  for (const i of rows) list.append(row(i));
}

function meta(label, node) {
  return node == null ? null
    : el('div', { class: 'm' }, el('span', { class: 'mk', text: label }), node);
}

// The pull request an issue is waiting on, as a real anchor. Null without one, so
// callers can append it unconditionally. Clicks don't bubble into row selection.
function prLink(i, text) {
  const href = i.pr && safeUrl(i.pr);
  if (!href) return null;
  return el('a', { class: 'prlink', href, title: i.pr, text: text || i.pr,
    target: '_blank', rel: 'noreferrer noopener',
    onclick: e => e.stopPropagation() });
}

// --- v6 markdown bodies: a tiny, self-contained, DOM-based subset renderer ----
// Builds nodes via createElement/textContent (never innerHTML) so body text can
// never inject executable HTML; link URLs are scheme-validated.
function safeUrl(u) {
  u = (u || '').trim();
  return /^(https?:|mailto:|#|\/|\.)/i.test(u) ? u : null;
}
function inlineMd(text) {
  const out = [];
  let rest = text;
  const re = /(`[^`]+`)|(\*\*[^*]+\*\*)|(\*[^*]+\*|_[^_]+_)|(\[[^\]]+\]\([^)\s]+\))/;
  while (rest) {
    const m = re.exec(rest);
    if (!m) { out.push(document.createTextNode(rest)); break; }
    if (m.index > 0) out.push(document.createTextNode(rest.slice(0, m.index)));
    const tok = m[0];
    if (tok[0] === '`') out.push(el('code', { text: tok.slice(1, -1) }));
    else if (tok.slice(0, 2) === '**') out.push(el('strong', {}, ...inlineMd(tok.slice(2, -2))));
    else if (tok[0] === '*' || tok[0] === '_') out.push(el('em', {}, ...inlineMd(tok.slice(1, -1))));
    else {
      const lm = /^\[([^\]]+)\]\(([^)\s]+)\)$/.exec(tok), url = lm && safeUrl(lm[2]);
      if (url) out.push(el('a', { href: url, target: '_blank', rel: 'noopener noreferrer' }, ...inlineMd(lm[1])));
      else out.push(document.createTextNode(tok));
    }
    rest = rest.slice(m.index + tok.length);
  }
  return out;
}
function renderMarkdown(text) {
  const frag = document.createDocumentFragment();
  const lines = (text || '').replace(/<!--[\s\S]*?-->/g, '').replace(/\r\n?/g, '\n').split('\n');
  let i = 0, para = [];
  const flush = () => { if (para.length) { frag.append(el('p', {}, ...inlineMd(para.join(' ')))); para = []; } };
  const LIST = /^\s*([-*]|\d+\.)\s+/;
  while (i < lines.length) {
    const line = lines[i];
    if (/^```/.test(line)) {
      flush(); const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      frag.append(el('pre', { class: 'md-code' }, el('code', { text: buf.join('\n') })));
      continue;
    }
    const hm = /^(#{1,6})\s+(.*)$/.exec(line);
    if (hm) { flush(); frag.append(el('h' + Math.min(hm[1].length, 6), {}, ...inlineMd(hm[2]))); i++; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { flush(); frag.append(el('hr')); i++; continue; }
    if (LIST.test(line)) {
      flush();
      const ordered = /^\s*\d+\.\s+/.test(line);
      const list = el(ordered ? 'ol' : 'ul', { class: 'md-list' });
      while (i < lines.length && LIST.test(lines[i])) {
        const item = lines[i].replace(LIST, '');
        const tm = /^\[([ xX])\]\s+(.*)$/.exec(item);
        if (tm) {
          const box = el('input', { type: 'checkbox', disabled: 'disabled' });
          if (tm[1].toLowerCase() === 'x') box.checked = true;
          list.append(el('li', { class: 'md-task' }, box, ...inlineMd(tm[2])));
        } else {
          list.append(el('li', {}, ...inlineMd(item)));
        }
        i++;

  rows.forEach((i, n) => {
    const extra = el('span', { class: 'rmark' });
    // `trck next` is `ready[:1]` — the top row is that single best pick.
    if (n === 0) extra.append(el('span', { class: 'nextpill', title: 'trck next', text: 'next' }));
    const mark = demandMark(i);
    if (mark) extra.append(mark);
    box.append(row(i, extra));
  });
}
// --- v4 tree / hierarchy view: collapsible forest from roots -> children -----
function toggleCollapse(id) {
  if (state.collapsed.has(id)) state.collapsed.delete(id);
  else state.collapsed.add(id);
  renderTree();
}
// Only the facets the current view actually applies count as "filtering" — a
// leftover status selection must not make board claim it is showing a subset.
// A facet narrows when a box is *un*checked now, everything starting checked, so a
// full selection is the neutral state rather than an empty one.
const filterActive = () => !!state.q
  || facetsFor(state.view).some(f => state[f].size < FACET_VALUES[f].size);
// A node is visible when it matches the filter, or any descendant does — so a
// matching leaf keeps its ancestor path. Post-order, cycle-guarded.
function visibleNodes() {
  const vis = new Set();
  const walk = (id, seen) => {
    const i = byId[id];
    if (!i || seen.has(id)) return false;
    seen.add(id);
    let any = false;
    for (const k of (i.children || [])) if (walk(k, seen)) any = true;
    if (any || matches(i)) { vis.add(id); return true; }
    return false;
  };
  for (const id of DATA.roots) walk(id, new Set());
  return vis;
}
function renderTreeNode(container, id, depth, vis, searching) {
  const i = byId[id];
  if (!i) return;
  const kids = (i.children || []).filter(k => vis.has(k));
  const hasKids = kids.length > 0;
  // A search expands past a collapsed parent — a match buried inside one reads as no
  // match at all. Unchecking a facet is a different gesture: it narrows the population
  // on show, and throwing the whole tree open because `done` was hidden would discard
  // the shape the reader arranged. The collapsed set is kept either way, never cleared.
  const collapsed = !searching && state.collapsed.has(id);
  const cls = 'trow' + (terminal.has(i.status) ? ' done' : '') + (id === state.selected ? ' sel' : '');
  const r = el('div', { class: cls, style: 'padding-left:' + (0.6 + depth * 1.1) + 'rem',
    onclick: () => select(id) });
  const caret = el('span', { class: 'tcaret' + (hasKids ? '' : ' leaf'),
    text: hasKids ? (collapsed ? '▸' : '▾') : '·' });
  if (hasKids) caret.addEventListener('click', e => { e.stopPropagation(); toggleCollapse(id); });
  r.append(caret, ridSpan(id, 'rid'), el('span', { class: 'ttitle', text: i.title }));
  if (i.progress) {
    r.append(el('span', { class: 'tbar' }, el('i', { style: 'width:' + i.progress.pct + '%' })),
      el('span', { class: 'tpct', text: i.progress.pct + '%' }));
  } else {
    r.append(el('span', { class: 'badge', text: i.priority }),
      el('span', { class: 'badge', text: i.status }));
    // `is_ready` is leaf-only, so this always lands on the badge branch — a parent
    // shows its progress bar instead and is never itself actionable.
    if (i.ready) r.append(el('span', { class: 'badge ready',
      title: 'nothing blocks this — see the ready view for where it ranks', text: 'ready' }));
  }
  const pl = prLink(i, 'PR');
  if (pl) r.append(pl);
  container.append(r);
  if (hasKids && !collapsed) for (const k of kids) renderTreeNode(container, k, depth + 1, vis, searching);
}
function renderTree() {
  const box = $('#tree'); box.textContent = '';
  const searching = !!state.q;
  const vis = visibleNodes();
  const roots = DATA.roots.filter(id => vis.has(id));
  if (!roots.length) {
    // The wording keys off the wider test: a facet that leaves nothing owes the reader
    // "no matching issues", even though it is not the thing that forces an expand.
    box.append(el('p', { class: 'gempty', text: filterActive() ? 'No matching issues.' : 'No issues.' }));
    return;
  }
  for (const id of roots) renderTreeNode(box, id, 0, vis, searching);
}
function renderGraph() {
  const box = $('#graph'); box.textContent = '';
  box.append(graphToolbar());

  const all = new Set();
  for (const e of DATA.edges) { all.add(e.from); all.add(e.to); }
  const active = filterActive();
  // Filter bar seeds the graph: show the union of the matches' dependency cones.
  let nodes = active ? coneOf(graphSeeds()) : new Set(all);
  // Done-filtering, mirroring the engine's filter_deps_graph_ids.
  if (!state.graphIncludeDone) {
    const a = restrictedAdj(nodes);
    for (const comp of components([...nodes], a))
      if (comp.every(id => byId[id] && byId[id].terminal)) comp.forEach(id => nodes.delete(id));
  }
  if (state.graphOmitDone)
    for (const id of [...nodes]) if (byId[id] && byId[id].terminal) nodes.delete(id);

  if (!nodes.size) {
    box.append(el('p', { class: 'gempty',
      text: active ? 'No matching issues have dependencies to show.' : 'No dependencies to show.' }));
    return;
  }

  const edges = DATA.edges.filter(e => nodes.has(e.from) && nodes.has(e.to));
  const preds = {}, adj = {};
  for (const e of edges) {
    (preds[e.to] = preds[e.to] || []).push(e.from);
    (adj[e.from] = adj[e.from] || []).push(e.to);
    (adj[e.to] = adj[e.to] || []).push(e.from);
  }
  const nodeList = [...nodes].sort((a, b) => a.localeCompare(b));
  // Flow the components left→right, wrapping to a new row when the pane width is
  // exceeded, so the graph grows down (natural scroll) rather than out.
  const laid = components(nodeList, adj).map(c => ({ comp: c, ...layoutComponent(c, preds) }));
  const avail = Math.max(box.clientWidth - PAD * 2, ...laid.map(l => l.w), 320);
  const pos = {}, bend = {};
  let x = PAD, y = PAD, rowH = 0, W = 0;
  for (const l of laid) {
    if (x > PAD && x + l.w > PAD + avail) { x = PAD; y += rowH + COMP_GAP; rowH = 0; }
    for (const id of l.comp) pos[id] = { x: x + l.local[id].x, y: y + l.local[id].y };
    for (const k in l.bends) bend[k] = l.bends[k].map(p => ({ x: x + p.x, y: y + p.y }));
    x += l.w + COMP_GAP;
    rowH = Math.max(rowH, l.h);
    W = Math.max(W, x - COMP_GAP);
  }
  const H = y + rowH + PAD;
  W += PAD;
  const s = sv('svg', { width: W, height: H, viewBox: '0 0 ' + W + ' ' + H });
  // `userSpaceOnUse` pins the head to ARROW user units regardless of stroke width, so
  // the curve's shortening below stays exactly as long as the triangle. refX 0 anchors
  // the base — not the tip — at the path's end, and the head grows forward from there.
  // Two heads, identical but for their fill, because a <marker> paints with its own and
  // cannot take the stroke of the path that references it. `.gedge.hi` swaps to the second.
  const head = (id, fill) => sv('marker',
    { id, viewBox: '0 0 10 10', refX: '0', refY: '5', markerWidth: ARROW, markerHeight: ARROW,
      markerUnits: 'userSpaceOnUse', orient: 'auto' },
    sv('path', { d: 'M0,0 L10,5 L0,10 z', fill }));
  s.append(sv('defs', {}, head('arrow', 'var(--muted)'), head('arrow-hi', 'var(--accent)')));
  // Edges share one group so that lifting a highlighted one — which means re-appending it,
  // SVG having no z-index — raises it above its neighbours but never above a node box.
  const edgeLayer = sv('g', {});
  s.append(edgeLayer);
  const incident = {};
  // One path per edge, routed through whatever placeholders the layout gave it: a curve
  // into each row it crosses, straight down that row's band, then a curve on. Every hop
  // uses the same half-gap vertical handles as a direct edge, so a routed edge reads the
  // same as a short one — and because each hop arrives vertically, `orient: auto` still
  // points the head straight down.
  const hop = (px, py, qx, qy) =>
    ' C' + px + ',' + (py + ROW_GAP / 2) + ' ' + qx + ',' + (qy - ROW_GAP / 2) + ' ' + qx + ',' + qy;
  for (const e of edges) {
    const a = pos[e.from], b = pos[e.to];
    if (!a || !b) continue;
    const x2 = b.x + NODE_W / 2, y2 = b.y - ARROW;
    let px = a.x + NODE_W / 2, py = a.y + NODE_H, d = 'M' + px + ',' + py;
    for (const p of (bend[e.from + ' ' + e.to] || [])) {
      d += hop(px, py, p.x, p.y) + ' L' + p.x + ',' + (p.y + NODE_H);
      px = p.x; py = p.y + NODE_H;
    }
    // Trimming ARROW off the final y leaves the head to cover exactly the missing stretch.
    const path = sv('path', { class: 'gedge', 'marker-end': 'url(#arrow)', d: d + hop(px, py, x2, y2) });
    edgeLayer.append(path);
    (incident[e.from] = incident[e.from] || []).push(path);
    (incident[e.to] = incident[e.to] || []).push(path);
  }
  // Hovering a node pulls the edges it touches out of the tangle: accent them, and
  // re-append so they sit above the ones they cross. Transient by design — selection
  // already owns the accent persistently and drives the detail pane, whereas this only
  // answers "what is this joined to" for as long as the pointer is on it.
  const lift = (id, on) => {
    for (const p of (incident[id] || [])) {
      p.classList.toggle('hi', on);
      if (on) edgeLayer.append(p);
    }
  };
  for (const id of nodes) {
    const i = byId[id], p = pos[id];
    const cls = 'gnode' + (i && terminal.has(i.status) ? ' done' : '') + (id === state.selected ? ' sel' : '');
    const g = sv('g', { class: cls, transform: 'translate(' + p.x + ',' + p.y + ')', onclick: () => select(id),
                        onmouseenter: () => lift(id, true), onmouseleave: () => lift(id, false) });
    g.append(sv('rect', { width: NODE_W, height: NODE_H, rx: 7 }));
    g.append(sv('title', { text: (i ? i.title : id) }));
    // Label with the id prefix emphasised (tspans), then the title truncated to fit ~20 chars.
    const n = (i && i.plen) || id.length, rest = i ? '  ' + i.title : '';
    const label = sv('text', { x: 8, y: NODE_H / 2 + 4 },
      sv('tspan', { text: '#' }),
      sv('tspan', { class: 'gidpre', text: id.slice(0, n) }),
      n < id.length ? sv('tspan', { class: 'gidrest', text: id.slice(n) }) : null);
    if (rest) label.append(sv('tspan', { text: trunc(rest, 20 - 1 - id.length) }));
    g.append(label);
    s.append(g);
  }
  box.append(s);
}

function applyFilter() {
  renderActiveView();   // tree/board narrow to matches; graph reseeds from them
}

// One checkbox per configured value, so a tracker with a custom vocabulary gets
// its own facets with no change here. `sel` is the live Set the boxes mutate.
function fillFacet(box, caption, values, sel) {
  box.append(el('span', { class: 'fcap', text: caption }));
  for (const v of values)
    box.append(checkbox(v, sel.has(v), on => {
      if (on) sel.add(v); else sel.delete(v);
      applyFilter();
    }, 'fbox'));
}

// Drag the divider to resize the left pane vs. the detail panel; the width is
// clamped, persisted per file (localStorage), and the active view re-renders on
// release since graph wrapping / board columns depend on the pane width.
function initSplit() {
  const bar = $('#split'), main = document.querySelector('main');
  const KEY = 'trck-html:leftw';
  try { const s = localStorage.getItem(KEY); if (s) main.style.setProperty('--leftw', s); } catch (e) {}
  let dragging = false;
  bar.addEventListener('mousedown', e => {
    dragging = true; bar.classList.add('drag');
    document.body.style.cursor = 'col-resize'; document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const rect = main.getBoundingClientRect();
    const w = Math.max(200, Math.min(e.clientX - rect.left, rect.width - 240));
    main.style.setProperty('--leftw', w + 'px');
  });
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false; bar.classList.remove('drag');
    document.body.style.cursor = ''; document.body.style.userSelect = '';
    try { localStorage.setItem(KEY, main.style.getPropertyValue('--leftw')); } catch (e) {}
    renderActiveView();
  });
}

function init() {
  $('#repo').textContent = DATA.repo || 'trck';
  renderCounts();
  fillFacet($('#ffstatus'), 'status', DATA.config.statuses.map(s => s.name), state.status);
  fillFacet($('#ffpriority'), 'priority', DATA.config.priorities, state.priority);
  syncFacetBar();
  $('#q').addEventListener('input', e => { state.q = e.target.value; applyFilter(); });
  $('#pcopy').addEventListener('click', copyAll);
  $('#pclear').addEventListener('click', clearEdits);
  for (const b of document.querySelectorAll('.viewtoggle button'))
    b.addEventListener('click', () => setView(b.dataset.view));
  initSplit();
  renderActiveView();
  renderDetail();
  renderPending();
}
init();

</script>
</body>
