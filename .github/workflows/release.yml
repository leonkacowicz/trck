name: Release

# Builds the per-platform binaries and attaches them to the release for the tag that
# triggered it. Runs on a tag rather than a published release so the assets exist before
# anyone can download them; the release is created here if it does not exist yet.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build assets for'
        required: true

permissions:
  contents: write

jobs:
  # The tag namespace is shared with the Python engine's releases by history, and this
  # workflow only knows how to build the Rust one. Without this, tagging the final Python
  # release would cross-build six targets from whatever the workspace Cargo.toml happened
  # to say — publishing binaries whose version disagrees with the tag that produced them.
  #
  # Seconds, and before the matrix: a mismatched tag costs a checkout, not a full
  # cross-build.
  #
  # It skips rather than fails. A tag that is not this crate's version is not this
  # workflow's business — the final Python release is tagged deliberately and would
  # otherwise leave a red run behind for doing the right thing. The trade is that a
  # genuinely mistaken Rust tag publishes nothing quietly, which you notice the same way
  # you would notice any release that failed to appear: it isn't there. The summary says
  # which happened.
  guard:
    name: tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      is_rust_release: ${{ steps.check.outputs.match }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Does the tag name this crate's version?
        id: check
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          crate="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$tag" = "v$crate" ]; then
            echo "match=true" >> "$GITHUB_OUTPUT"
            echo "### Building $tag" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "match=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Skipped: $tag is not a Rust release"
              echo ""
              echo "This workflow builds the Rust binary, and the workspace \`Cargo.toml\`"
              echo "says \`$crate\`, so \`v$crate\` is the tag it would build."
              echo ""
              echo "If you meant to release the binary, bump \`Cargo.toml\` in the same"
              echo "commit you tag. If this tag is the Python engine's, nothing to do."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: guard
    if: needs.guard.outputs.is_rust_release == 'true'
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc: the default on any mainstream distro.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # musl: statically linked, so it runs on Alpine and on a distro older than
          # the builder's glibc — which is what makes "download and run" true rather
          # than "download and discover your glibc is too old".
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}

      # The only cross-compile that needs a linker the runner does not ship. No
      # dependencies means nothing else to cross-build, which is why this is one line
      # rather than a cross-compilation harness.
      - name: Linker for aarch64-musl
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
          mkdir -p .cargo
          {
            echo '[target.aarch64-unknown-linux-musl]'
            echo 'linker = "aarch64-linux-gnu-gcc"'
          } >> .cargo/config.toml

      - name: Musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # One binary per archive, named for the target, so the install script can compute
      # the asset name from `uname` without listing the release first.
      # The staging tree is built in stage/, NOT in dist/, so dist/ holds exactly the files
      # that get published and nothing else. It used to stage inside dist/, and the upload
      # glob was `dist/*.*` — which matches the staging *directory*, because the version
      # number in its name contains dots. Every artifact therefore carried a loose copy of
      # its own contents, and `gh release upload dist/*` died on "is a directory".
      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          name="trck-${tag}-${{ matrix.target }}"
          mkdir -p "stage/${name}" dist
          cp "target/${{ matrix.target }}/release/trck" "stage/${name}/"
          cp README.md LICENSE "stage/${name}/" 2>/dev/null || true
          tar -czf "dist/${name}.tar.gz" -C stage "${name}"
          (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          name="trck-${tag}-${{ matrix.target }}"
          mkdir -p "stage/${name}" dist
          cp "target/${{ matrix.target }}/release/trck.exe" "stage/${name}/"
          cp README.md LICENSE "stage/${name}/" 2>/dev/null || true
          (cd stage && 7z a "../dist/${name}.zip" "${name}" >/dev/null)
          (cd dist && certutil -hashfile "${name}.zip" SHA256 | sed -n 2p > "${name}.zip.sha256")

      # Every publishable file, and only those: dist/ now contains nothing else.
      - name: Nothing but files in dist/
        shell: bash
        run: |
          if find dist -mindepth 1 -maxdepth 1 -type d | grep -q .; then
            echo "::error::dist/ contains a directory; only release assets belong there" >&2
            find dist -mindepth 1 -maxdepth 1 >&2
            exit 1
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # The gate the issue asks for: install the artifact exactly as a user would, then run
  # the conformance suite against it. A release that cannot pass its own spec must not
  # be publishable, and the only way to know is to run the thing that was built rather
  # than the thing in target/.
  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: x86_64-unknown-linux-musl
          path: dist
      # Unpacked into its own directory and installed from there by an exact path. Searching
      # `dist` for anything called `trck` would have been satisfied by a stray copy sitting
      # beside the tarball — which is precisely what the artifacts used to contain — so the
      # suite could have certified a binary the tarball never held.
      - name: Unpack as a user would
        run: |
          mkdir -p unpacked
          tar -xzf dist/*.tar.gz -C unpacked
          bin="$(find unpacked -name trck -type f | head -1)"
          [ -n "$bin" ] || { echo "::error::no trck inside the tarball" >&2; exit 1; }
          install -m 755 "$bin" /usr/local/bin/trck
          trck version
      - name: Conformance against the published artifact
        run: python3 conformance/run.py --bin "$(command -v trck)"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
                 --title "$tag" --generate-notes
          gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
