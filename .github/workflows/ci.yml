name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Runs FIRST, against the pristine checkout: ./trck is generated from
      # src/trck/, so the committed engine must equal build(src/). The test suite
      # regenerates ./trck (see tests/__init__.py), so this check has to come
      # before it to catch a commit where ./trck was left stale.
      - name: ./trck is in sync with src/trck/
        run: python3 build.py --check

      - name: Test suite
        run: python3 -m unittest discover -s tests -v

      # scripts/ holds standalone one-shots that are no longer part of the
      # executable: an integer-id converter and a timestamp backfill. Neither
      # imports the engine, and neither has anything to say about an engine
      # change, so they run as their own suite rather than gating every commit.
      # The one claim that spans both sides — that the engine accepts what the
      # converter produces — is made there by running ./trck as a subprocess.
      - name: Helper-script suite
        run: python3 -m unittest discover -s scripts/tests -v

      # The executable specification. It execs ./trck rather than importing it, so
      # this same step will one day run against the Rust binary via TRCK_BIN.
      - name: Conformance suite
        run: python3 conformance/run.py

      - name: Tracker consistency
        run: python3 ./trck check
