name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Merging is gated on three of these jobs, so a check that never reports blocks a pull
  # request indefinitely — which is what a GitHub Actions outage looks like from here. This
  # is the way to make one report without inventing an empty commit to hang it on.
  workflow_dispatch:

jobs:
  # Does this change touch the engine at all?
  #
  # A pull request that only edits prose cannot break the build, so it has no business
  # running three platforms of it. `paths-ignore` cannot express that here:
  # merging is gated on named checks, and a workflow filtered out by paths never reports
  # them — the pull request would wait forever for a check that will never arrive. A job
  # skipped by an `if:` *does* report, and branch protection counts skipped as passing. So
  # the gate lives on the jobs, and this is what they consult.
  #
  # The rule itself is in scripts/ci_changed.py, under test, because the way it fails is
  # silent: a rule that wrongly says "skippable" makes the checks green by never running
  # them. Uncertainty resolves to running everything — including for a push or a manual
  # dispatch, where `main` being green should mean the whole suite said so.
  #
  # `matrix` is the same answer in the shape `rust` needs. A **matrix** job cannot take the
  # `if:` the others do: skipped before it expands, it reports once under the bare job name
  # and the per-combination check `rust (ubuntu-latest)` — which merging is gated on — never
  # arrives at all. That is the same indefinite wait `paths-ignore` would have caused. So
  # `rust` always runs; what shrinks is the matrix it runs over, and what its steps do.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
      matrix: ${{ steps.classify.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The three-dot diff below needs the merge base with the target branch.
          fetch-depth: 0

      - id: classify
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          code=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            # --no-renames so a rename reports both paths: moving a file *out* of docs/ is
            # a code change, and rename detection would report only where it landed.
            code=$(git diff --no-renames --name-only "origin/$BASE_REF...HEAD" \
                   | tee changed-paths.txt \
                   | python3 scripts/ci_changed.py)
            echo "Changed paths:"; cat changed-paths.txt
          fi
          if [ "$code" = "true" ]; then
            matrix='["ubuntu-latest", "macos-latest", "windows-latest"]'
          else
            # One runner, and only because the matrix job cannot be skipped whole. The other
            # two are about cross-platform correctness, which a prose edit cannot affect.
            matrix='["ubuntu-latest"]'
          fi
          echo "Runs the engine's suites: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # The helper scripts: a timestamp backfill, an id converter, the installer, this
  # workflow's own path classifier, and the pre-commit hook. None of them is part of the
  # engine, and they run as their own suite for that reason — a one-shot nobody will run
  # again should not gate every engine change. Two of them do reach for a built binary,
  # and skip cleanly when there isn't one.
  scripts:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Helper-script suite
        run: python3 -m unittest discover -s scripts/tests -v

  # The code-quality ratchet: existing debt is grandfathered and may only ever shrink.
  #
  # Two gates. `check` is freshness — the committed report must describe the code as it
  # now stands, so a change that adds a long function cannot pass by leaving the report
  # behind. `compare` is the ratchet proper.
  #
  # `compare` needs a baseline, and where that comes from depends on the event. Upstream's
  # own workflow compares only on pull requests, which is right for a repo that takes them;
  # this one is pushed to directly, so a PR-only gate would never fire. On a push the
  # baseline is the commit that was at the head before it — `github.event.before` — which
  # makes the ratchet bite on exactly the change being pushed.
  quality:
    name: quality ratchet
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The baseline is built from the base commit's tree, which a shallow checkout
          # cannot produce.
          fetch-depth: 0

      - uses: leonkacowicz/ratchet@v0.2.0

      # The report must describe the code as it is, or the ratchet measures fiction.
      - name: Report is fresh
        run: ratchet check --root .

      # The baseline is **measured**, not read out of the base commit's report.
      #
      # `--base` resolves it with `git show <base>:quality-report.json`, so the comparison
      # is only meaningful while both sides were written by the same ratchet. They are
      # not, the day the tool's own metrics change: 0.2.0 began counting test code, which
      # made every file in this repository read as a large regression against a 0.1.1
      # baseline, on a change that touched no code at all. Re-measuring the base tree with
      # the ratchet in this job compares like with like, and goes on doing so across every
      # future version bump instead of needing a one-off exemption each time.
      #
      # Each side keeps its own `ratchet.json`, so a threshold edit still reaches
      # `compare` and is still refused when it arrives alongside new violations.
      - name: No quality regression vs the base branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          ./scripts/ratchet_baseline.sh "origin/${{ github.base_ref }}"

      # A branch's first push reports an all-zero "before" and has nothing to compare
      # against; ratchet's own bootstrap mode covers a baseline with no report yet.
      - name: No quality regression vs the previous commit
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: ./scripts/ratchet_baseline.sh "${{ github.event.before }}"

  # The installer, on the platform it was broken on.
  #
  # It unpacks the Windows artifact with `tar`, because Windows 10 1803+ ships bsdtar and a
  # stock Windows has no unzip — a claim no Linux runner can check, since its `tar` is GNU
  # tar and cannot read a zip at all. So the assertion is made here, under Git Bash, against
  # a release built on disk and served over `file://`. If the fallback chain ever stops
  # finding something that can open a zip, this is the job that says so.
  installer:
    name: installer (windows)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install from a local release
        shell: bash
        run: python -m unittest scripts.tests.test_install -v

  # The port, measured rather than described. It began with an empty binary reporting a
  # pass rate of 0; --min-pass is a floor that only moves up, so the port could never
  # regress and every raise is a visible commit. It now sits at the full suite.
  #
  # This job carries no `if:` — see `changes`. Skipping a matrix job withholds the
  # per-combination check that merging is gated on, and the pull request waits for it
  # forever. So on a prose-only change it still runs, over one platform, and does the one
  # thing left worth doing: prove the engine still builds.
  rust:
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Format
        if: needs.changes.outputs.code == 'true'
        run: cargo fmt --all --check

      - name: Lints
        if: needs.changes.outputs.code == 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Unconditional, because this job cannot be skipped as a whole and a check that
      # reports green without having done anything is worse than no check. The conformance
      # suite below needs the binary anyway, and the crate has no dependencies, so it is a
      # short build.
      - name: Build
        run: cargo build --release

      - name: Test
        if: needs.changes.outputs.code == 'true'
        run: cargo test --all

      # Linux only: the fixtures compare output literally, and path rendering and
      # line endings differ on Windows. Cross-platform correctness is the build and
      # test matrix above; the fixtures are about behaviour.
      #
      # This is the specification, and the only thing that says the engine still does what
      # it is supposed to. --min-pass is a floor that only moves up, so a fixture cannot
      # quietly stop passing and every raise is a visible commit.
      - name: Conformance (the specification)
        if: matrix.os == 'ubuntu-latest' && needs.changes.outputs.code == 'true'
        run: python3 conformance/run.py --bin target/release/trck --min-pass 288
