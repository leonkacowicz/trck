name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Runs FIRST, against the pristine checkout: ./trck is generated from
      # src/trck/, so the committed engine must equal build(src/). The test suite
      # regenerates ./trck (see tests/__init__.py), so this check has to come
      # before it to catch a commit where ./trck was left stale.
      - name: ./trck is in sync with src/trck/
        run: python3 build.py --check

      - name: Test suite
        run: python3 -m unittest discover -s tests -v

      # scripts/backfill_timestamps.py is a standalone one-shot that does not
      # import the engine. Its tests shell out to git on every case and have
      # nothing to say about an engine change, so they run as their own suite
      # rather than inside the one that guards every commit. (scripts/renumber.py
      # is tested from tests/, because what matters there is that the engine
      # accepts what the script produces.)
      - name: Helper-script suite
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Tracker consistency
        run: python3 ./trck check
