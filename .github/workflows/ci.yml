name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The helper scripts: a timestamp backfill, an id converter, and the installer. None of
  # them is part of the engine, and they run as their own suite for that reason — a
  # one-shot nobody will run again should not gate every engine change. Two of them do
  # reach for a built binary, and skip cleanly when there isn't one.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Helper-script suite
        run: python3 -m unittest discover -s scripts/tests -v

  # The code-quality ratchet: existing debt is grandfathered and may only ever shrink.
  #
  # Two gates. `check` is freshness — the committed report must describe the code as it
  # now stands, so a change that adds a long function cannot pass by leaving the report
  # behind. `compare` is the ratchet proper.
  #
  # `compare` needs a baseline, and where that comes from depends on the event. Upstream's
  # own workflow compares only on pull requests, which is right for a repo that takes them;
  # this one is pushed to directly, so a PR-only gate would never fire. On a push the
  # baseline is the commit that was at the head before it — `github.event.before` — which
  # makes the ratchet bite on exactly the change being pushed.
  quality:
    name: quality ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `compare` resolves its baseline with `git show <base>:quality-report.json`,
          # which a shallow checkout cannot answer.
          fetch-depth: 0

      - uses: leonkacowicz/ratchet@v0.1.1

      # The report must describe the code as it is, or the ratchet measures fiction.
      - name: Report is fresh
        run: ratchet check --root .

      - name: No quality regression vs the base branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          ratchet compare --root . --base "origin/${{ github.base_ref }}"

      # A branch's first push reports an all-zero "before" and has nothing to compare
      # against; ratchet's own bootstrap mode covers a baseline with no report yet.
      - name: No quality regression vs the previous commit
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: ratchet compare --root . --base "${{ github.event.before }}"

  # The installer, on the platform it was broken on.
  #
  # It unpacks the Windows artifact with `tar`, because Windows 10 1803+ ships bsdtar and a
  # stock Windows has no unzip — a claim no Linux runner can check, since its `tar` is GNU
  # tar and cannot read a zip at all. So the assertion is made here, under Git Bash, against
  # a release built on disk and served over `file://`. If the fallback chain ever stops
  # finding something that can open a zip, this is the job that says so.
  installer:
    name: installer (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install from a local release
        shell: bash
        run: python -m unittest scripts.tests.test_install -v

  # The port, measured rather than described. It began with an empty binary reporting a
  # pass rate of 0; --min-pass is a floor that only moves up, so the port could never
  # regress and every raise is a visible commit. It now sits at the full suite.
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --all

      # Linux only: the fixtures compare output literally, and path rendering and
      # line endings differ on Windows. Cross-platform correctness is the build and
      # test matrix above; the fixtures are about behaviour.
      #
      # This is the specification, and the only thing that says the engine still does what
      # it is supposed to. --min-pass is a floor that only moves up, so a fixture cannot
      # quietly stop passing and every raise is a visible commit.
      - name: Conformance (the specification)
        if: matrix.os == 'ubuntu-latest'
        run: python3 conformance/run.py --bin target/release/trck --min-pass 242

      # This repository's own tracker, checked by the engine it ships. It lives here rather
      # than in a job of its own because it needs a built binary and this is where one
      # exists — and it must live *somewhere*: an inconsistent tracker that nothing checks
      # is a tracker that stops being true without anyone finding out.
      - name: Tracker consistency
        if: matrix.os == 'ubuntu-latest'
        run: ./target/release/trck check
