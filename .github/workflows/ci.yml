name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Merging is gated on three of these jobs, so a check that never reports blocks a pull
  # request indefinitely — which is what a GitHub Actions outage looks like from here. This
  # is the way to make one report without inventing an empty commit to hang it on.
  workflow_dispatch:

jobs:
  # Does this change touch the engine at all?
  #
  # A pull request that only edits tracker data or prose cannot break the build, so it has
  # no business running three platforms of it. `paths-ignore` cannot express that here:
  # merging is gated on named checks, and a workflow filtered out by paths never reports
  # them — the pull request would wait forever for a check that will never arrive. A job
  # skipped by an `if:` *does* report, and branch protection counts skipped as passing. So
  # the gate lives on the jobs, and this is what they consult.
  #
  # The rule itself is in scripts/ci_changed.py, under test, because the way it fails is
  # silent: a rule that wrongly says "skippable" makes the checks green by never running
  # them. Uncertainty resolves to running everything — including for a push or a manual
  # dispatch, where `main` being green should mean the whole suite said so.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The three-dot diff below needs the merge base with the target branch.
          fetch-depth: 0

      - id: classify
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          code=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            # --no-renames so a rename reports both paths: moving a file *out* of issues/
            # is a code change, and rename detection would report only where it landed.
            code=$(git diff --no-renames --name-only "origin/$BASE_REF...HEAD" \
                   | tee changed-paths.txt \
                   | python3 scripts/ci_changed.py)
            echo "Changed paths:"; cat changed-paths.txt
          fi
          echo "Runs the engine's suites: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # The helper scripts: a timestamp backfill, an id converter, and the installer. None of
  # them is part of the engine, and they run as their own suite for that reason — a
  # one-shot nobody will run again should not gate every engine change. Two of them do
  # reach for a built binary, and skip cleanly when there isn't one.
  scripts:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Helper-script suite
        run: python3 -m unittest discover -s scripts/tests -v

  # The code-quality ratchet: existing debt is grandfathered and may only ever shrink.
  #
  # Two gates. `check` is freshness — the committed report must describe the code as it
  # now stands, so a change that adds a long function cannot pass by leaving the report
  # behind. `compare` is the ratchet proper.
  #
  # `compare` needs a baseline, and where that comes from depends on the event. Upstream's
  # own workflow compares only on pull requests, which is right for a repo that takes them;
  # this one is pushed to directly, so a PR-only gate would never fire. On a push the
  # baseline is the commit that was at the head before it — `github.event.before` — which
  # makes the ratchet bite on exactly the change being pushed.
  quality:
    name: quality ratchet
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `compare` resolves its baseline with `git show <base>:quality-report.json`,
          # which a shallow checkout cannot answer.
          fetch-depth: 0

      - uses: leonkacowicz/ratchet@v0.1.1

      # The report must describe the code as it is, or the ratchet measures fiction.
      - name: Report is fresh
        run: ratchet check --root .

      - name: No quality regression vs the base branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          ratchet compare --root . --base "origin/${{ github.base_ref }}"

      # A branch's first push reports an all-zero "before" and has nothing to compare
      # against; ratchet's own bootstrap mode covers a baseline with no report yet.
      - name: No quality regression vs the previous commit
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: ratchet compare --root . --base "${{ github.event.before }}"

  # The installer, on the platform it was broken on.
  #
  # It unpacks the Windows artifact with `tar`, because Windows 10 1803+ ships bsdtar and a
  # stock Windows has no unzip — a claim no Linux runner can check, since its `tar` is GNU
  # tar and cannot read a zip at all. So the assertion is made here, under Git Bash, against
  # a release built on disk and served over `file://`. If the fallback chain ever stops
  # finding something that can open a zip, this is the job that says so.
  installer:
    name: installer (windows)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install from a local release
        shell: bash
        run: python -m unittest scripts.tests.test_install -v

  # The port, measured rather than described. It began with an empty binary reporting a
  # pass rate of 0; --min-pass is a floor that only moves up, so the port could never
  # regress and every raise is a visible commit. It now sits at the full suite.
  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --all

      # Linux only: the fixtures compare output literally, and path rendering and
      # line endings differ on Windows. Cross-platform correctness is the build and
      # test matrix above; the fixtures are about behaviour.
      #
      # This is the specification, and the only thing that says the engine still does what
      # it is supposed to. --min-pass is a floor that only moves up, so a fixture cannot
      # quietly stop passing and every raise is a visible commit.
      - name: Conformance (the specification)
        if: matrix.os == 'ubuntu-latest'
        run: python3 conformance/run.py --bin target/release/trck --min-pass 266

      # This repository's own tracker, checked by the engine it ships. It rides along here
      # because it needs a built binary and this is where one exists. When this job is
      # skipped the `tracker` job below builds one for it — the check must live *somewhere*
      # on every change, and an issues-only pull request is precisely the change that can
      # break it.
      - name: Tracker consistency
        if: matrix.os == 'ubuntu-latest'
        run: ./target/release/trck check

  # The other half of that check: the one thing an issues- or docs-only pull request still
  # has to prove. It runs exactly when `rust` does not, so the tracker is validated on every
  # change and built twice on none.
  #
  # It builds the engine rather than downloading a release, for the same reason nothing is
  # vendored: the tracker must be answered for by the engine in this commit, not by whatever
  # version happens to be published. The crate has no dependencies, so that is a short build.
  tracker:
    name: tracker consistency
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Build
        run: cargo build --release

      - name: Tracker consistency
        run: ./target/release/trck check
