name: Tracker

# This repository's own issue tracker, checked by the engine it ships.
#
# Its own workflow rather than a job in `ci.yml`, because the two run over branches that
# share no history: `trck-issues` is an orphan whose root *is* the tracker, with no
# `Cargo.toml`, no `src/`, and nothing for the code suites to say about it.
#
# It must also never become a required check on `main`. Branch protection waits for the
# checks it names, and one that only ever fires on a push to `trck-issues` would never
# arrive on a pull request — the same indefinite wait `paths-ignore` would have caused in
# `ci.yml`. Keeping it in a separate workflow, on a separate trigger, is what makes that
# structural rather than a rule someone has to remember.
#
# The file lives on `main` and nowhere else. GitHub resolves a workflow from the ref it is
# dispatched on, so `--ref trck-issues` is refused outright — which is why the manual run
# below has to name the branch itself rather than trusting `github.sha`.
on:
  push:
    branches: [trck-issues]
  workflow_dispatch:

jobs:
  check:
    name: tracker consistency
    runs-on: ubuntu-latest
    steps:
      # The engine comes from `main`, not from the pushed branch — the branch has no engine.
      # Built from source rather than downloaded for the same reason nothing here is
      # vendored: the tracker is answered for by the engine this repository currently ships,
      # so a change that breaks `check` cannot hide behind an older release.
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Build
        run: cargo build --release

      # What to check, fetched into the engine's checkout so that git can resolve it.
      #
      # On a push, `github.sha` rather than the branch tip: another push landing while this
      # one runs must not silently move what is being checked. On a manual run it has to be
      # the branch, because `github.sha` is then `main` — this file only exists on `main`, so
      # that is the only ref a dispatch can name, and checking `main` as a tracker fails for
      # the uninteresting reason that its root is not one.
      - name: Fetch the tracker commit
        run: git fetch --no-tags --depth=1 origin "${{ github.event_name == 'push' && github.sha || 'trck-issues' }}"

      # Read out of the object store, with nothing checked out — which is how every read verb
      # reaches a ref-backed tracker, so this exercises the path users are on. `FETCH_HEAD`
      # rather than repeating the expression above: whichever of the two was fetched, it is
      # what the fetch just wrote, and nothing between here and there fetches anything else.
      - name: Check
        run: ./target/release/trck --ref FETCH_HEAD check
