name: Tracker

# This repository's own issue tracker, checked by the engine it ships.
#
# Its own workflow rather than a job in `ci.yml`, because the two run over branches that
# share no history: `trck-issues` is an orphan whose root *is* the tracker, with no
# `Cargo.toml`, no `src/`, and nothing for the code suites to say about it.
#
# It must also never become a required check on `main`. Branch protection waits for the
# checks it names, and one that only ever fires on a push to `trck-issues` would never
# arrive on a pull request — the same indefinite wait `paths-ignore` would have caused in
# `ci.yml`. Keeping it in a separate workflow, on a separate trigger, is what makes that
# structural rather than a rule someone has to remember.
on:
  push:
    branches: [trck-issues]
  workflow_dispatch:

jobs:
  check:
    name: tracker consistency
    runs-on: ubuntu-latest
    steps:
      # The engine comes from `main`, not from the pushed branch — the branch has no engine.
      # Built from source rather than downloaded for the same reason nothing here is
      # vendored: the tracker is answered for by the engine this repository currently ships,
      # so a change that breaks `check` cannot hide behind an older release.
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Build
        run: cargo build --release

      # The commit that was pushed, fetched into the engine's checkout so that git can
      # resolve it. `github.sha` rather than the branch tip: another push landing while this
      # one runs must not silently move what is being checked.
      - name: Fetch the tracker commit
        run: git fetch --no-tags --depth=1 origin "${{ github.sha }}"

      # Read out of the object store, with nothing checked out — which is how every read
      # verb reaches a ref-backed tracker, so this exercises the path users are on.
      - name: Check
        run: ./target/release/trck --ref "${{ github.sha }}" check
